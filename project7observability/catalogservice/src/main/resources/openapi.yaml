openapi: 3.0.3
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: http://localhost:8001/api/v1
    description: Generated server url
security:
  - bearerAuth: []
tags:
  - name: Categories
    description: Product category management
  - name: Products
    description: Product management and catalog search

paths:
  /api/products/{id}:
    put:
      tags:
        - Products
      summary: Update a product
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          description: Product ID
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequestDto"
        required: true
      responses:
        "200":
          description: Product updated
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ProductResponseDto"
        "400":
          description: Invalid request
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ProductResponseDto"
        "404":
          description: Product or category not found
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
        - Products
      summary: Delete a product
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          description: Product ID
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Product deleted
        "401":
          description: Authentication required
        "404":
          description: Product not found
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/products:
    get:
      tags:
        - Products
      summary: List products
      operationId: getAllProducts
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: "price,asc"
      responses:
        "200":
          description: Products returned
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ProductPageResponseDto"
    post:
      tags:
        - Products
      summary: Create a product
      operationId: createProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequestDto"
        required: true
      responses:
        "201":
          description: Product created
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ProductResponseDto"
        "400":
          description: Invalid request
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ProductResponseDto"
        "404":
          description: Category not found
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/categories:
    get:
      tags:
        - Categories
      summary: List categories
      operationId: getAllCategories
      responses:
        "200":
          description: Categories returned
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponseDto"
        "401":
          description: Authentication required
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponseDto"
    post:
      tags:
        - Categories
      summary: Create a category
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequestDto"
        required: true
      responses:
        "201":
          description: Category created
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/CategoryResponseDto"
        "400":
          description: Invalid request or duplicate category
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/CategoryResponseDto"
  /api/products/{id}/summary:
    get:
      tags:
        - Products
      summary: Get a product by ID
      operationId: getProductById
      parameters:
        - name: id
          in: path
          description: Product ID
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Product returned
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ProductResponseDto"
        "401":
          description: Authentication required
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ProductResponseDto"
        "404":
          description: Product not found
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/products/search:
    get:
      tags:
        - Products
      summary: Search products by name
      operationId: searchProducts
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: "price,asc"
      responses:
        "200":
          description: Matching products returned
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ProductPageResponseDto"
  /api/products/ping:
    get:
      tags:
        - Products
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/products/filter:
    get:
      tags:
        - Products
      summary: Filter products
      operationId: filterProducts
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: "price,asc"
      responses:
        "200":
          description: Filtered products returned
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ProductPageResponseDto"
  /api/products/delay:
    get:
      tags:
        - Products
      operationId: delay
      parameters:
        - name: ms
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 6000
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/categories/{id}:
    get:
      tags:
        - Categories
      summary: Get a category by ID
      operationId: getCategoryById
      parameters:
        - name: id
          in: path
          description: Category ID
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Category returned
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/CategoryResponseDto"
        "401":
          description: Authentication required
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/CategoryResponseDto"
        "404":
          description: Category not found
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    ProductRequestDto:
      type: object
      description: Product creation or update details
      properties:
        name:
          type: string
        price:
          type: number
          format: double
          minimum: 0.0
        quantity:
          type: integer
          format: int32
          minimum: 0
        categoryId:
          type: integer
          format: int64
        imageUrl:
          type: string
      required:
        - categoryId
        - name
        - price
        - quantity
    ProductResponseDto:
      type: object
      description: Product response
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
          format: double
        quantity:
          type: integer
          format: int32
        categoryName:
          type: string
        imageUrl:
          type: string
    ApiError:
      type: object
      description: Standard API error response
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
    CategoryRequestDto:
      type: object
      description: Category creation details
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name
    CategoryResponseDto:
      type: object
      description: Category response
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductResponseDto"
    ProductPageResponseDto:
      type: object
      description: Stable paginated product response
      properties:
        content:
          type: array
          description: Products in the requested page
          items:
            $ref: "#/components/schemas/ProductResponseDto"
        page:
          type: integer
          format: int32
          description: Zero-based page number
          example: 0
        size:
          type: integer
          format: int32
          description: Number of products requested per page
          example: 10
        totalElements:
          type: integer
          format: int64
          description: Total number of matching products
          example: 42
        totalPages:
          type: integer
          format: int32
          description: Total number of available pages
          example: 5


  securitySchemes:
    bearerAuth:
      type: http
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
