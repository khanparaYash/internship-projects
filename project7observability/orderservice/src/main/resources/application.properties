spring.application.name=orderservice
server.servlet.context-path=/api/v1
server.port=8002

spring.datasource.url=jdbc:mysql://localhost:3306/project6_orders
spring.datasource.username=root
spring.datasource.password=123456789

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.register-with-eureka= true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone= http://localhost:8761/eureka/
eureka.instance.prefer-ip-address= true


jwt.secret=VGhpcy1pcy1hLWRldi1zZWNyZXQta2V5LWZvci1qd3Qtc2lnbmluZw==


management.endpoints.web.exposure.include=health,metrics,circuitbreakers,circuitbreakerevents,info,loggers
management.endpoint.health.show-details=always

spring.cloud.openfeign.client.config.default.connectTimeout=4000
spring.cloud.openfeign.client.config.default.readTimeout=5000


resilience4j.retry.instances.catalogService.max-attempts=2
resilience4j.retry.instances.catalogService.wait-duration=2s

resilience4j.circuitbreaker.instances.catalogService.minimum-number-of-calls= 3
resilience4j.circuitbreaker.instances.catalogService.sliding-window-size= 10
resilience4j.circuitbreaker.instances.catalogService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.catalogService.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.catalogService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.catalogService.ignore-exceptions[0]=feign.FeignException$NotFound
resilience4j.circuitbreaker.instances.catalogService.ignore-exceptions[1]=feign.FeignException$BadRequest



resilience4j.retry.instances.paymentService.max-attempts=2
resilience4j.retry.instances.paymentService.wait-duration=2s

resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls= 3
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size= 10
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.paymentService.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.paymentService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.paymentService.ignore-exceptions[0]=feign.FeignException$NotFound
resilience4j.circuitbreaker.instances.paymentService.ignore-exceptions[1]=feign.FeignException$BadRequest


management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.version=1.0.0
info.app.description=order Management Microservice
info.app.owner=Yash Khanpara

management.endpoint.health.group.readiness.include=readinessState,db,catalog
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true