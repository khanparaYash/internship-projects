openapi: 3.0.3
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: http://localhost:8000/api/v1
    description: Generated server url
tags:
  - name: Authentication
    description: User registration and authentication

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a user
      description: Creates a new user account.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequestDto"
        required: true
      responses:
        "201":
          description: User registered successfully
          content:
            '*/*':
              schema:
                type: string
        "400":
          description: Invalid request or email already registered
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      description: Authenticates a user and returns a JWT bearer token.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestDto"
        required: true
      responses:
        "200":
          description: Login successful
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/LoginResponseDto"
        "401":
          description: Invalid email or password
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    RegisterRequestDto:
      type: object
      description: New user registration details
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 2147483647
          minLength: 6
      required:
        - email
        - name
        - password
    ApiError:
      type: object
      description: Standard API error response
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
    LoginRequestDto:
      type: object
      description: User login credentials
      properties:
        email:
          type: string
          format: email
          description: Registered email address
          example: user@example.com
        password:
          type: string
          format: password
          description: Account password
          example: secret123
    LoginResponseDto:
      type: object
      description: JWT authentication response
      properties:
        token:
          type: string
          description: Signed JWT access token
          example: eyJhbGciOiJIUzI1NiJ9...
        tokenType:
          type: string
          description: Token type
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Token lifetime in milliseconds
          example: 3600000
