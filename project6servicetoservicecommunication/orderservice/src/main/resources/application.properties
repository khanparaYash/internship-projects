spring.application.name=orderservice
server.servlet.context-path=/api/v1
server.port=8002

spring.datasource.url=jdbc:mysql://localhost:3306/project6_orders
spring.datasource.username=root
spring.datasource.password=123456789

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.register-with-eureka= true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone= http://localhost:8761/eureka/
eureka.instance.prefer-ip-address= true

# Use a base64-encoded 256-bit secret in production.
jwt.secret=VGhpcy1pcy1hLWRldi1zZWNyZXQta2V5LWZvci1qd3Qtc2lnbmluZw==
jwt.expiration-ms=86400000


management.endpoints.web.exposure.include=health,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always

spring.cloud.openfeign.client.config.default.connectTimeout=4000
spring.cloud.openfeign.client.config.default.readTimeout=5000


resilience4j.retry.instances.catalogService.max-attempts=2
resilience4j.retry.instances.catalogService.wait-duration=2s

resilience4j.circuitbreaker.instances.catalogService.minimum-number-of-calls= 5
resilience4j.circuitbreaker.instances.catalogService.sliding-window-size= 10
resilience4j.circuitbreaker.instances.catalogService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.catalogService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.catalogService.ignore-exceptions[0]=feign.FeignException$NotFound
resilience4j.circuitbreaker.instances.catalogService.ignore-exceptions[1]=feign.FeignException$BadRequest